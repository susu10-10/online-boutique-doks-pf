apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd # Must match the namespace where Argo CD is installed
  finalizers:
    - resources-finalizer.argocd.argoproj.io # Enables cascading delete
spec:
  project: default
  source:
    repoURL: 'https://falcosecurity.github.io/charts' # Helm registry URL
    chart: falco   # Chart name
    targetRevision: 9.1.0      # Version of the chart
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/susu10-10/online-boutique-doks-pf/main/clusters/boutique/platform-configs/helm-values/falco.yaml
  destination:
    server: 'https://kubernetes.default.svc'    # Target cluster
    namespace: falco                    # Target namespace
  syncPolicy:
    automated:
      prune: true                               # Automatically delete removed resources
      selfHeal: true                            # Fix configuration drift automatically
    syncOptions:
      - CreateNamespace: true                     # Automatically create target namespace
