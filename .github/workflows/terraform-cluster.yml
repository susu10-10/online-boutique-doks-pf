name: Terraform DOKS Cluster

on:
  workflow_run:
    workflows: ["Terraform DOKS Main"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  terraform-cluster:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/cluster
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6
      - run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_do_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
          TF_VAR_do_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_gitops_token: ${{ secrets.GITOPS_TOKEN }}
      - run: terraform validate
      - run: terraform plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_do_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
          TF_VAR_do_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_gitops_token: ${{ secrets.GITOPS_TOKEN }}
      - run: terraform apply -auto-approve
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_do_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
          TF_VAR_do_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_gitops_token: ${{ secrets.GITOPS_TOKEN }}