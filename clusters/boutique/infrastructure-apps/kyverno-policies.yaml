apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/susu10-10/online-boutique-doks-pf'
    targetRevision: HEAD
    path: clusters/boutique/platform-configs/kyverno/policies
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true