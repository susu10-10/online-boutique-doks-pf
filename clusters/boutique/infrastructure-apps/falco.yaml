apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  sources:
    - chart: falco
      repoURL: https://falcosecurity.github.io/charts
      targetRevision: 9.1.0
      helm:
        valueFiles:
          - $values/clusters/boutique/platform-configs/helm-values/falco.yaml

    - repoURL: https://github.com/susu10-10/online-boutique-doks-pf
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: falco

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true