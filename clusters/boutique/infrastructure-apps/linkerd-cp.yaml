apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-cp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: linkerd-control-plane
      repoURL: 'https://helm.linkerd.io/stable'
      targetRevision: 1.16.11
      helm:
        valueFiles:
          - $values/clusters/boutique/platform-configs/helm-values/linkerd.yaml
    - repoURL: 'https://github.com/susu10-10/online-boutique-doks-pf'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: linkerd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true