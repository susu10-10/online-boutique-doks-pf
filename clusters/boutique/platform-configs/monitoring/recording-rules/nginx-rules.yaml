apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: nginx-recording-rules
  namespace: prometheus
  labels:
    release: prometheus

spec:
  groups:

  - name: nginx.recording.rules
    interval: 30s

    rules:


    #
    # Total Ingress Requests/sec
    #
    - record: nginx:requests:rate
      expr: |
        sum(
          rate(
            nginx_ingress_controller_requests[5m]
          )
        )


    #
    # HTTP 2xx Responses/sec
    #
    - record: nginx:http_2xx:rate
      expr: |
        sum(
          rate(
            nginx_ingress_controller_requests{
              status=~"2.."
            }[5m]
          )
        )


    #
    # HTTP 4xx Responses/sec
    #
    - record: nginx:http_4xx:rate
      expr: |
        sum(
          rate(
            nginx_ingress_controller_requests{
              status=~"4.."
            }[5m]
          )
        )


    #
    # HTTP 5xx Responses/sec
    #
    - record: nginx:http_5xx:rate
      expr: |
        sum(
          rate(
            nginx_ingress_controller_requests{
              status=~"5.."
            }[5m]
          )
        )


    #
    # Error Percentage
    #
    - record: nginx:error_rate:percent
      expr: |
        100 *
        (
          sum(
            rate(
              nginx_ingress_controller_requests{
                status=~"5.."
              }[5m]
            )
          )
          /
          sum(
            rate(
              nginx_ingress_controller_requests[5m]
            )
          )
        )


    #
    # Request Latency P50
    #
    - record: nginx:latency:p50
      expr: |
        histogram_quantile(
          0.50,
          sum by(le)(
            rate(
              nginx_ingress_controller_request_duration_seconds_bucket[5m]
            )
          )
        )


    #
    # Request Latency P95
    #
    - record: nginx:latency:p95
      expr: |
        histogram_quantile(
          0.95,
          sum by(le)(
            rate(
              nginx_ingress_controller_request_duration_seconds_bucket[5m]
            )
          )
        )


    #
    # Active Connections
    #
    - record: nginx:connections:active
      expr: |
        sum(
          nginx_ingress_controller_nginx_process_connections
        )