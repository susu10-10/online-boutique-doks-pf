apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
labels:
- pairs:
    app.kubernetes.io/part-of: online-boutique
resources:
- frontend.yaml
- adservice.yaml
- cartservice.yaml
- checkoutservice.yaml
- emailservice.yaml
- paymentservice.yaml
- productcatalogservice.yaml
- recommendationservice.yaml
- shippingservice.yaml
- currencyservice.yaml
- redis.yaml
- network-policies

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all-deployments # Kustomize ignores this name and matches the target kind
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: idpreg
  target:
    kind: Deployment
