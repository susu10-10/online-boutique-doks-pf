apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: loki
      repoURL: 'https://grafana-community.github.io/helm-charts/'
      targetRevision: 18.7.0
      helm:
        valueFiles:
          - $values/clusters/boutique/platform-configs/helm-values/loki.yaml
    - repoURL: 'https://github.com/susu10-10/online-boutique-doks-pf'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true